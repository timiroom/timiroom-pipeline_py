services:
  pipeline:
    build: .
    env_file:
      - .env
    environment:
      DB_URL: postgresql://user:password@postgres:5432/timiroom
      PORT: "8080"
      RAG_DOCUMENT_TABLE: document_chunks
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

  consistency:
    build:
      context: ../timiroom-consistency_py
    env_file:
      - ../timiroom-consistency_py/.env
    environment:
      APP_ENV: local
      HOST: 0.0.0.0
      PORT: "8080"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.timiroom.kro.kr/codex/v1}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-5.4-mini}
    ports:
      - "8082:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/actuator/health/readiness', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: timiroom
    ports:
      - "5432:5432"
    volumes:
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d timiroom"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
