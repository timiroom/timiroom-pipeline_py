name: Deploy Python RAG pipeline

on:
  workflow_dispatch:
  push:
    branches: [develop]

permissions:
  contents: read

env:
  IMAGE_TAG: sha-${{ github.sha }}

concurrency:
  group: ops-deploy-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/timiroom-pipeline-py:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.4.3"

      - name: Install kubeseal
        run: |
          wget -q https://github.com/bitnami-labs/sealed-secrets/releases/download/v0.27.3/kubeseal-0.27.3-linux-amd64.tar.gz
          tar -xzf kubeseal-0.27.3-linux-amd64.tar.gz kubeseal
          sudo mv kubeseal /usr/local/bin/

      - name: Update NAS GitOps image and sealed secret
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          PIPELINE_DB_URL: ${{ secrets.PIPELINE_DB_URL }}
          PIPELINE_UPSTAGE_API_KEY: ${{ secrets.PIPELINE_UPSTAGE_API_KEY }}
          PIPELINE_OPENAI_API_KEY: ${{ secrets.PIPELINE_OPENAI_API_KEY }}
          PIPELINE_COHERE_API_KEY: ${{ secrets.PIPELINE_COHERE_API_KEY }}
          PIPELINE_EXAONE_API_KEY: ${{ secrets.PIPELINE_EXAONE_API_KEY }}
          PIPELINE_EXAONE_ENDPOINT_ID: ${{ secrets.PIPELINE_EXAONE_ENDPOINT_ID }}
          PIPELINE_INTERNAL_API_TOKEN: ${{ secrets.PIPELINE_INTERNAL_API_TOKEN }}
        run: |
          for required in \
            PIPELINE_DB_URL \
            PIPELINE_UPSTAGE_API_KEY \
            PIPELINE_OPENAI_API_KEY \
            PIPELINE_COHERE_API_KEY; do
            if [ -z "${!required}" ]; then
              echo "Required production secret is empty: $required" >&2
              exit 1
            fi
          done

          # 토큰은 주소가 아니라 인증 헤더로 보낸다. 주소에 넣으면 GitHub가 redirect할 때 토큰이 빠져
          # 'could not read Username'으로 실패했다.
          OPS_AUTH=$(printf 'x-access-token:%s' "$GH_PAT" | base64 -w0)
          echo "::add-mask::$OPS_AUTH"
          for attempt in 1 2 3; do
            rm -rf timiroom-ops
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $OPS_AUTH" clone https://github.com/timiroom/timiroom-ops.git && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep $((attempt * 5))
          done
          git -C timiroom-ops config http.https://github.com/.extraheader "AUTHORIZATION: basic $OPS_AUTH"
          cd timiroom-ops/apps/rag-pipeline
          kustomize edit set image rag-pipeline-image=${{ secrets.DOCKER_USERNAME }}/timiroom-pipeline-py:${{ env.IMAGE_TAG }}

          printf '%s\n' \
            "DB_URL=$PIPELINE_DB_URL" \
            "UPSTAGE_API_KEY=$PIPELINE_UPSTAGE_API_KEY" \
            "OPENAI_API_KEY=$PIPELINE_OPENAI_API_KEY" \
            "COHERE_API_KEY=$PIPELINE_COHERE_API_KEY" \
            "EXAONE_API_KEY=$PIPELINE_EXAONE_API_KEY" \
            "EXAONE_ENDPOINT_ID=$PIPELINE_EXAONE_ENDPOINT_ID" \
            "INTERNAL_API_TOKEN=$PIPELINE_INTERNAL_API_TOKEN" \
            > temp-secrets.env
          test -s temp-secrets.env
          kubectl create secret generic rag-pipeline-secrets -n timiroom \
            --from-env-file=temp-secrets.env --dry-run=client -o yaml > plain-secret.yaml
          kubeseal --format=yaml --cert=pub-cert.pem \
            < plain-secret.yaml > sealed-secret.yaml
          rm -f temp-secrets.env plain-secret.yaml

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add kustomization.yaml sealed-secret.yaml
          git commit -m "chore: deploy Python RAG pipeline [${{ env.IMAGE_TAG }}]"
          for attempt in 1 2 3 4 5; do
            git push && break
            if [ "$attempt" = 5 ]; then exit 1; fi
            # 다른 배포가 먼저 올렸으면 그 위에 다시 쌓고 재시도한다(서비스마다 다른 폴더라 충돌하지 않는다)
            sleep $((attempt * 3))
            git pull --rebase
          done